[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "inventory-decision-lab"
version = "0.2.0"
description = "From-scratch multi-echelon simulation, service-aware optimization and chronological evaluation"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<9"]
[project.scripts]
inventory-lab = "inventory_lab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
inventory_lab = ["sql/*.sql"]
[tool.pytest.ini_options]
testpaths = ["tests"]
